<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121416">
<script>try{var p=JSON.parse(localStorage.getItem("liftlog.theme"));if(p)document.documentElement.dataset.palette=p}catch(e){}</script>
<title>Lift Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lift Log">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette tokens (names kept from the first version): --red = accent fill, --red-text = headings/strong text,
     --red-dim = labels, --red-deep = accent wash, --red-hi = accent text on dark, --val = data (white).
     Default is Steel blue; Settings switches html[data-palette]. Layout: one column on phones, two-column grids from 1000px. */
  --bg:#121416;
  --surface:#1a1d20;
  --surface-2:#22262a;
  --line:#2c3137;
  --red:#4f78a3;
  --red-text:#dfe3e8;
  --red-dim:#959ca4;
  --red-deep:#1b2633;
  --red-hi:#86aad3;
  --on-red:#ffffff;
  --val:#ffffff;
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:12px;
  color-scheme:dark;
}

html[data-palette="dusty"]{--bg:#141313;--surface:#1c1b1b;--surface-2:#252323;--line:#332e2d;--red:#a94a44;--red-text:#e6e1e0;--red-dim:#a19895;--red-deep:#2c1d1c;--red-hi:#d6867e;--on-red:#ffffff}
html[data-palette="sage"]{--bg:#121413;--surface:#1a1d1b;--surface-2:#222724;--line:#2c3330;--red:#5b7c59;--red-text:#e0e5df;--red-dim:#969e95;--red-deep:#1c271d;--red-hi:#9cc098;--on-red:#ffffff}
html[data-palette="mono"]{--bg:#0f1012;--surface:#18191b;--surface-2:#212225;--line:#2e3034;--red:#ececec;--red-text:#e6e6e6;--red-dim:#9b9b9b;--red-deep:#26282b;--red-hi:#ffffff;--on-red:#111111}
html[data-palette="red"]{--bg:#000000;--surface:#0c0c0c;--surface-2:#161616;--line:#2c1416;--red:#e3141b;--red-text:#ff3a3a;--red-dim:#cc5555;--red-deep:#2a080a;--red-hi:#ff3a3a;--on-red:#000000}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--red-text);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red-text);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.v,.val{color:var(--val)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header + dropdown menu ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:.05em;text-transform:uppercase;color:var(--red-hi);border:0;background:none;padding:0}
.sync{margin-left:auto;font-size:13px;color:var(--red-dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync:not(.ok):not(.busy):not(.bad){display:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--red-dim);display:inline-block}
.sync.ok i{background:var(--red)}
.sync.busy i{background:transparent;border:2px solid var(--red)}
.sync.bad i{background:transparent;border:2px dashed var(--red-dim)}
@media (max-width:520px){.sync span{display:none}.sync.bad span{display:inline}.brand{font-size:22px}.menu-btn .lbl-long{display:none}}
@media (min-width:521px){.menu-btn .lbl-short{display:none}}
.menu-wrap{position:relative}
.menu-btn{white-space:nowrap;display:flex;align-items:center;gap:8px;border:1px solid var(--red);background:var(--bg);color:var(--red-text);border-radius:10px;padding:8px 12px;min-height:42px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.menu-btn svg{width:20px;height:20px}
.menu-btn[aria-expanded="true"]{background:var(--red);color:var(--on-red)}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:240px;background:var(--surface);border:1px solid var(--red);border-radius:12px;padding:6px;box-shadow:0 18px 40px rgb(0 0 0 / .7)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px;border-radius:8px;font-weight:700;font-size:16px;color:var(--red-text);text-transform:uppercase;letter-spacing:.05em}
.menu button svg{width:20px;height:20px;flex:none}
.menu button:hover{background:var(--red-deep)}
.menu button[aria-current="page"]{background:var(--red);color:var(--on-red)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
main{max-width:1080px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:18px}
.narrow{max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* ---------- shared pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red-dim)}
.page-h{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:clamp(46px,9vw,64px);line-height:.92;color:var(--red-text)}
.h2{font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em;color:var(--red-text)}
.dim{color:var(--red-dim)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--red);background:transparent;color:var(--red-text);border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;letter-spacing:.02em}
.btn:hover{background:var(--red-deep)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red);text-transform:uppercase;letter-spacing:.06em}
.btn.primary:hover{filter:brightness(1.12)}
.btn.quiet{border-color:var(--line)}
.btn.armed{background:var(--red);color:var(--on-red)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase}
.chip.pr{background:var(--red);color:var(--on-red)}
.chip.out{border:1px solid var(--red);color:var(--red-text)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 10px;border-radius:7px;font-weight:700;font-size:14px;color:var(--red-dim)}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--on-red)}
select.sel{border:1px solid var(--red);background:var(--bg);color:var(--val);border-radius:10px;padding:9px 12px;font-weight:600;min-height:44px;max-width:100%}
.empty{padding:26px 16px;text-align:center;color:var(--red-dim);border:1px dashed var(--line);border-radius:var(--radius)}
.banner{border:1px solid var(--red);color:var(--red-text);border-radius:10px;padding:10px 14px;font-size:14px}

/* ---------- home ---------- */
.home-grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:1000px){.home-grid{grid-template-columns:1.1fr 1fr;align-items:start}}
.streak{background:var(--surface);border:1px solid var(--red);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.streak::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid var(--red-deep);pointer-events:none}
.streak .big{display:flex;align-items:flex-end;gap:14px;position:relative;z-index:1}
.streak .n{font-family:var(--font-display);font-weight:900;font-size:clamp(110px,28vw,168px);line-height:.8;color:var(--val);font-variant-numeric:tabular-nums}
.streak .lbl{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,7vw,40px);line-height:.95;text-transform:uppercase;color:var(--red-text);padding-bottom:6px}
.streak .status{position:relative;z-index:1;font-weight:600}
.streak .meta{display:flex;gap:22px;flex-wrap:wrap;position:relative;z-index:1}
.streak .meta b{display:block;font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--val);line-height:1}
.week{display:flex;gap:6px;justify-content:space-between;position:relative;z-index:1}
.week .d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--red-dim);flex:1}
.week .d b{width:100%;max-width:40px;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--val);font-variant-numeric:tabular-nums}
.week .d.on b{background:var(--red);border-color:var(--red);color:var(--val)}
.week .d.today b{border:2px solid var(--red-text)}
.log-cta{font-family:var(--font-display);font-size:30px;font-weight:900;min-height:72px;border-radius:14px}
.prlist{display:flex;flex-direction:column}
.prlist .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prlist .it:first-child{border-top:0}
.prlist .it .exn{font-weight:700;color:var(--red-text)}
.prlist .it .num-big{margin-left:auto;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--val)}
.stats3{display:flex;gap:22px;flex-wrap:wrap}
.stats3 b{display:block;font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--val);line-height:1.05}

/* ---------- log: choose the day ---------- */
.split-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.split-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.split{position:relative;text-align:left;border:1px solid var(--red);background:var(--surface);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:6px;min-height:150px;color:var(--red-text)}
.split:hover{background:var(--red-deep)}
.split .nm{font-family:var(--font-display);font-weight:900;font-size:clamp(56px,14vw,72px);line-height:.85;text-transform:uppercase}
.split .sb{font-size:14px;color:var(--red-dim);font-weight:600}
.split .last{margin-top:auto;font-size:14px;color:var(--red-dim)}
.split .last b{color:var(--val);font-weight:700}
.split.next{background:var(--red);color:var(--on-red)}
.split.next .sb,.split.next .last{color:var(--on-red);opacity:.85}
.split.next .last b{color:var(--on-red)}
.split .tag{position:absolute;top:14px;right:14px}
.split.next .tag{background:var(--on-red);color:var(--red)}

/* ---------- log: active workout ---------- */
.active-head{display:flex;flex-direction:column;gap:8px}
.title-input{font-family:var(--font-display);font-weight:900;font-size:clamp(46px,11vw,68px);text-transform:uppercase;line-height:.95;border:0;background:transparent;padding:0;width:100%;color:var(--val)}
.title-input:focus{outline:none;border-bottom:2px solid var(--red)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;color:var(--red-dim);font-size:15px}
.meta input[type=date]{border:1px solid var(--line);background:var(--surface-2);color:var(--val);border-radius:8px;padding:5px 8px}
.meta .stat b{color:var(--val);font-family:var(--font-display);font-weight:800;font-size:22px;margin-right:4px}
.ex-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:1000px){.ex-grid{grid-template-columns:1fr 1fr;align-items:start}}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ex-h{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 8px}
.ex-h h3{font-size:19px;font-weight:700;line-height:1.2;color:var(--red-text)}
.ex-sub{font-size:13px;color:var(--red-dim);margin-top:3px;display:flex;flex-direction:column;gap:1px}
.ex-sub .val{font-weight:600}
.ex-act{margin-left:auto;display:flex;gap:2px;flex:none}
.icon-btn{border:0;background:none;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--red-dim)}
.icon-btn:hover{background:var(--red-deep);color:var(--red-text)}
.icon-btn.armed{background:var(--red);color:var(--on-red)}
.icon-btn:disabled{opacity:.25;cursor:default}
.icon-btn svg{width:18px;height:18px}
.sets{padding:0 8px}
.set-row{display:grid;grid-template-columns:34px minmax(0,1fr) 80px 66px 48px;gap:8px;align-items:center;padding:5px 6px;border-radius:9px}
.set-row.head{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red-dim);padding-top:2px;padding-bottom:2px}
.set-row.head span:nth-child(n+3){text-align:center}
.set-row.done{background:var(--red-deep)}
.setno{font-family:var(--font-display);font-weight:800;font-size:22px;text-align:center;color:var(--val)}
.setno .chip{padding:2px 6px}
.prev{font-size:14px;color:var(--val);opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.num{width:100%;height:48px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:26px;padding:0 4px;color:var(--val);font-variant-numeric:tabular-nums}
.num[data-f="t"],.num[data-f="d"]{font-size:20px}
.num::placeholder{color:var(--val);opacity:.28}
.num:focus{outline:none;border-color:var(--red)}
.set-row.done .num{background:#000;border-color:transparent}
.check{width:48px;height:48px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--red-dim)}
.check svg{width:24px;height:24px}
.check[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.ex-foot{display:flex;gap:8px;padding:8px 14px 14px}
.notes{width:100%;min-height:80px;border:1px solid var(--line);background:var(--surface);color:var(--val);border-radius:var(--radius);padding:12px;resize:vertical}
.notes::placeholder{color:var(--red-dim)}
.finish-bar{display:flex;gap:10px;position:sticky;bottom:12px;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.finish-bar .btn.primary{flex:1;font-size:18px;min-height:54px;box-shadow:0 8px 24px rgb(0 0 0 / .8)}
.finish-bar .btn.quiet{background:var(--bg);min-height:54px}

/* ---------- history ---------- */
.month-h{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--red-dim);margin-top:6px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hhead{display:flex;gap:14px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:14px;color:inherit}
.hdate{display:flex;flex-direction:column;align-items:center;min-width:46px;flex:none}
.hdate .dw{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--red-dim)}
.hdate .dn{font-family:var(--font-display);font-weight:900;font-size:36px;line-height:1;color:var(--val)}
.hmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hname{font-weight:800;font-size:18px;color:var(--val);text-transform:uppercase;letter-spacing:.03em}
.hsub{font-size:14px;color:var(--red-dim)}
.hsub b{color:var(--val);font-weight:600}
.hex{font-size:14px;color:var(--red-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbody{border-top:1px solid var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.hx{display:flex;flex-direction:column;gap:6px}
.hx .n{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--red-text)}
.setchips{display:flex;flex-wrap:wrap;gap:6px}
.setchips span{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:14px;font-weight:600;color:var(--val);font-variant-numeric:tabular-nums}
.hnotes{color:var(--val);margin:0;white-space:pre-wrap;font-size:14px}

/* ---------- progress ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile .v{font-family:var(--font-display);font-weight:900;font-size:40px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;font-weight:700;color:var(--red-dim);margin-left:4px;text-transform:uppercase}
.tile .l{font-size:13px;color:var(--red-dim);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.prog-grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:1000px){.prog-grid{grid-template-columns:1fr 1fr;align-items:start}}
.chart{position:relative;width:100%;min-height:230px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis-n{fill:var(--val);fill-opacity:.8;font-size:12px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.chart .axis-t{fill:var(--red-dim);font-size:12px;font-family:var(--font-body)}
.chart .ln{fill:none;stroke:var(--red);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--red);opacity:.16}
.chart .dot{fill:var(--red);stroke:var(--bg);stroke-width:2}
.chart .end-t{fill:var(--val);font-family:var(--font-display);font-weight:800;font-size:17px}
.chart .bar{fill:var(--red)}
.chart .xh{stroke:var(--red-dim);stroke-width:1;stroke-dasharray:3 3}
.chart .hit{fill:transparent}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface-2);border:1px solid var(--red);color:var(--red-text);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.4;max-width:230px;box-shadow:0 8px 24px rgb(0 0 0 / .7)}
.tip .val{font-weight:700}
.bests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.bests{grid-template-columns:1fr 1fr}}
.best{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.best .l{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--red-dim)}
.best .v{font-family:var(--font-display);font-weight:900;font-size:32px;line-height:1.05}
.best .s{font-size:13px;color:var(--val);opacity:.75}
.repgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:560px){.repgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.repgrid div{background:var(--surface-2);border-radius:8px;padding:8px;text-align:center}
.repgrid .r{font-size:12px;font-weight:700;color:var(--red-dim)}
.repgrid .w{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--val)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red-dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.tbl td{padding:8px;border-bottom:1px solid var(--line);color:var(--val)}
table.tbl td.r,table.tbl th.r{text-align:right}

/* ---------- edit exercise lists ---------- */
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.rcard .nm{font-family:var(--font-display);font-weight:900;font-size:40px;text-transform:uppercase;line-height:1;color:var(--red-text)}
.rlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.rlist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px;color:var(--red-text)}
.rlist li:first-child{border-top:0}
.rlist li .val{font-variant-numeric:tabular-nums;white-space:nowrap}
.redit-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 84px auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.redit-row .nm2{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;color:var(--red-text)}
.field{border:1px solid var(--line);background:var(--surface-2);color:var(--val);border-radius:8px;padding:8px 10px;width:100%;min-height:42px}
.field.c{text-align:center;font-variant-numeric:tabular-nums}
.tiny{font-size:11px;color:var(--red-dim);text-align:center;font-weight:800;letter-spacing:.08em;text-transform:uppercase}


/* ---------- splits ---------- */
.rcard.act{border-color:var(--red)}
.pname{font-family:var(--font-display);font-weight:900;font-size:34px;text-transform:uppercase;line-height:1;color:var(--red-text)}
.days{display:flex;flex-direction:column}
.dayrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.dayrow:first-child{border-top:0}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dname{font-family:var(--font-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.05;color:var(--red-text)}
.dsub{font-size:13px;color:var(--red-dim);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tpl{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;color:var(--red-text)}
.tpl b{font-size:15px}
.tpl span{font-size:12px;color:var(--red-dim)}
.tpl.on{border-color:var(--red);background:var(--red-deep)}
.gchips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.gchips button{flex:none;border:1px solid var(--line);background:none;color:var(--red-dim);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.gchips button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}


/* ---------- motivation player ---------- */
.stage{position:relative;width:100%;height:min(68vh,560px);background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.stage.q{height:auto;min-height:200px;display:flex;flex-direction:column;justify-content:center;padding:26px 20px 70px;background:radial-gradient(120% 90% at 100% 0%,var(--red-deep),#000 60%)}
.qtext{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,7vw,44px);line-height:1;text-transform:uppercase;color:var(--red-text);text-wrap:balance}
.sctl{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;align-items:center;gap:10px}
.sbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--red);background:rgb(0 0 0 / .6);color:var(--red-text);display:grid;place-items:center}
.sbtn svg{width:20px;height:20px}
.scount{font-size:13px;font-weight:700;color:var(--red-dim);background:rgb(0 0 0 / .6);padding:4px 10px;border-radius:999px}
.serr{position:absolute;top:10px;left:10px;right:10px;z-index:2;background:var(--red);color:var(--on-red);font-weight:700;font-size:14px;padding:8px 10px;border-radius:8px}
.clipman{display:flex;flex-direction:column;gap:10px}
.clipman .rlist li{align-items:center}


/* ---------- sign in ---------- */
.auth{max-width:440px;width:100%;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.auth-brand{display:flex;flex-direction:column;line-height:.82;margin-bottom:6px}
.auth-brand .n{font-family:var(--font-display);font-weight:900;font-size:clamp(84px,24vw,120px);text-transform:uppercase;color:var(--red-hi)}
.auth-brand .n:last-child{color:var(--val)}
.auth-form{display:flex;flex-direction:column;gap:8px}
.auth-form .btn{margin-top:8px;min-height:52px;font-size:17px}
.auth-form .field{min-height:48px;font-size:17px}
.banner.okmsg{border-color:var(--line);color:var(--val)}


/* ---------- history edit + settings ---------- */
.set-row.e{grid-template-columns:34px minmax(0,1fr) minmax(0,1fr)}
.ex-grid.one{grid-template-columns:1fr}
.hgo{align-self:center;flex:none;font-size:13px;font-weight:700;color:var(--red-hi)}
.hcard:hover{border-color:var(--red)}
.hi{color:var(--red-hi)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.swatch{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;color:var(--red-text);font-weight:700}
.swatch[aria-pressed="true"]{border:2px solid var(--red);padding:11px}
.swatch .dots{display:flex;gap:6px}
.swatch .dots i{width:22px;height:22px;border-radius:50%;border:1px solid rgb(255 255 255 / .12)}
.swatch small{font-weight:500;color:var(--red-dim)}

/* ---------- exercise picker ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .75);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.overlay{align-items:center}}
.sheet{background:var(--surface);border:1px solid var(--red);width:100%;max-width:560px;max-height:86vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:760px){.sheet{border-radius:16px}}
.sheet-h{padding:14px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.sheet-h input{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--val);border-radius:10px;padding:10px 12px;min-height:44px}
.sheet-h input::placeholder{color:var(--red-dim)}
.sheet-b{overflow-y:auto;padding:6px 8px 16px}
.pg{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red-dim);padding:12px 8px 4px}
.pi{line-height:1.3;display:flex;width:100%;text-align:left;border:0;background:none;padding:11px 10px;border-radius:8px;font-size:16px;gap:10px;align-items:center;color:var(--red-text);font-weight:600}
.pi:hover{background:var(--red-deep)}
.pi .g{margin-left:auto;font-size:13px;color:var(--red-dim);font-weight:500}
.pi.create{color:var(--val)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:90;background:var(--red);color:var(--on-red);padding:11px 16px;border-radius:10px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgb(0 0 0 / .6);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){
  .set-row,.check,.split{transition:background-color .15s,border-color .15s}
  .toast{animation:pop .2s ease-out}
  .menu{animation:drop .14s ease-out}
  @keyframes pop{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  @keyframes drop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>

        <rect x="1" y="13" width="28" height="4" rx="1.5" style="fill:var(--line)"/>

        <rect x="10.5" y="7.5" width="3" height="15" rx="1.2" style="fill:var(--red)" opacity=".6"/>
        <rect x="20" y="4" width="5" height="22" rx="1.5" style="fill:var(--red)"/>
